# PR checks. Matrix cells must match RecipeRegistry pins (currently 5.4.0, 5.5.0).
# Catalog-version (no -PokhttpVersion) runs in catalog.yml when libs.versions.toml changes.
name: PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: android-37.0

jobs:
  plugin:
    name: plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;35.0.0"
      - name: Unpin machine-local JDK path
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^org.gradle.java.home=/d' plugin/gradle.properties
      - name: Plugin tests
        run: ./gradlew --no-daemon -p plugin test

  okhttp:
    name: okhttp ${{ matrix.okhttp }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        okhttp: ["5.4.0", "5.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;35.0.0"
      - name: Unpin machine-local JDK path
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^org.gradle.java.home=/d' plugin/gradle.properties
      - name: Bridge tests, compileOnly check, sample assemble
        run: >
          ./gradlew --no-daemon
          :bridge:checkOkHttpCompileOnly
          :bridge:testDebugUnitTest
          :sample:assembleDebug
          -PokhttpVersion=${{ matrix.okhttp }}
          -Pokhttpcronet.compileSdk=android-37.0

  device:
    name: device okhttp ${{ matrix.okhttp }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        okhttp: ["5.4.0", "5.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;35.0.0"
      - name: Unpin machine-local JDK path
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^org.gradle.java.home=/d' plugin/gradle.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test origin (Caddy + certs + /big payloads)
        run: |
          ./scripts/download-caddy.sh
          ./scripts/gen-certs.sh
      - name: Instrumented suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: >
            ./gradlew --no-daemon
            :sample:connectedDebugAndroidTest
            :sample:connectedMinifiedReleaseAndroidTest
            -PokhttpVersion=${{ matrix.okhttp }}
            -Pokhttpcronet.compileSdk=android-37.0
