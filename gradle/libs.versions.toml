[versions]
# Compile floor: bridge/plugin compileOnly. Must match the oldest RecipeRegistry pin.
okhttpMin = "5.4.0"
# Highest verified (sample default, -PokhttpVersion override for the CI matrix).
okhttp = "5.5.0"
# Sample / connected-suite pin. Hosts may ship a newer engine; Google 500.x renamed
# cronet-embedded -> cronet-bundled (cronet-embedded 500 is an empty alias).
cronetApi = "500.0.2"
cronetEmbedded = "500.0.2"
kotlin = "2.4.20"
agp = "9.4.1"
junit = "4.13.2"
asm = "9.10.1"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
compileSdk = "37"
minSdk = "24"
playServicesCronet = "18.1.1"
bcv = "0.18.2"
chucker = "4.3.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"

[libraries]
okhttp-min = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttpMin" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
cronet-api = { module = "org.chromium.net:cronet-api", version.ref = "cronetApi" }
cronet-embedded = { module = "org.chromium.net:cronet-embedded", version.ref = "cronetEmbedded" }
play-services-cronet = { module = "com.google.android.gms:play-services-cronet", version.ref = "playServicesCronet" }
junit = { module = "junit:junit", version.ref = "junit" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
