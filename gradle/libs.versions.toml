[versions]
okhttp = "5.5.0"
cronetApi = "143.7445.0"
cronetEmbedded = "143.7445.0"
kotlin = "2.2.20"
agp = "8.13.0"
junit = "4.13.2"
mockwebserver3 = "5.5.0"
asm = "9.7.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "mockwebserver3" }
cronet-api = { module = "org.chromium.net:cronet-api", version.ref = "cronetApi" }
cronet-embedded = { module = "org.chromium.net:cronet-embedded", version.ref = "cronetEmbedded" }
junit = { module = "junit:junit", version.ref = "junit" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
