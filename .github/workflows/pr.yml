# PR checks. Matrix cells must match RecipeRegistry pins (currently 5.4.0, 5.5.0).
# Catalog-version (no -PokhttpVersion) runs in catalog.yml when libs.versions.toml changes.
name: PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Unpin machine-local JDK path
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^org.gradle.java.home=/d' plugin/gradle.properties
      - name: Plugin tests
        run: ./gradlew --no-daemon -p plugin test

  okhttp:
    name: okhttp ${{ matrix.okhttp }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        okhttp: ["5.4.0", "5.5.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Unpin machine-local JDK path
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^org.gradle.java.home=/d' plugin/gradle.properties
      - name: Bridge tests, compileOnly check, instrumentation-tests assemble, demo assemble
        run: >
          ./gradlew --no-daemon
          :bridge:checkOkHttpCompileOnly
          :bridge:checkCronetCompileOnly
          :bridge:testDebugUnitTest
          :instrumentation-tests:assembleDebug
          :demo:assembleDebug
          -PokhttpVersion=${{ matrix.okhttp }}

  device:
    name: device okhttp ${{ matrix.okhttp }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        okhttp: ["5.4.0", "5.5.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Unpin machine-local JDK path
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i '/^org.gradle.java.home=/d' plugin/gradle.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test origin (Caddy + certs + /big payloads)
        run: |
          ./scripts/download-caddy.sh
          ./scripts/download-curl-http3.sh
          ./scripts/gen-certs.sh
      - name: Instrumented suites
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: >
            ./gradlew --no-daemon
            :instrumentation-tests:connectedDebugAndroidTest
            :instrumentation-tests:connectedMinifiedReleaseAndroidTest
            -PokhttpVersion=${{ matrix.okhttp }}
      - name: Dump test failures on failure
        if: failure()
        run: |
          for f in instrumentation-tests/build/outputs/androidTest-results/connected/*/*.xml; do
            if [ -f "$f" ] && grep -q '<failure' "$f"; then
              echo "::group::Test failures in $f"
              grep -B 2 -A 30 '<failure' "$f"
              echo "::endgroup::"
            fi
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-device-okhttp-${{ matrix.okhttp }}
          path: |
            instrumentation-tests/build/reports/androidTests/
            instrumentation-tests/build/outputs/androidTest-results/

